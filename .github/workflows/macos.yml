name: build-macos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Build Vela (dmg + app)
        run: ui/node_modules/.bin/tauri build --target aarch64-apple-darwin --features macos-glass

      - name: Smoke-test + screenshot the app (glass verification)
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Vela.app"
          open "$APP"
          sleep 12
          screencapture -x /tmp/vela-light.png
          # toggle dark mode and re-capture
          osascript -e 'tell app "System Events" to tell appearance preferences to set dark mode to true'
          sleep 3
          screencapture -x /tmp/vela-dark.png
          killall vela 2>/dev/null || true
          echo "captured:"
          ls -la /tmp/vela-*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Vela-macos-screenshots
          path: /tmp/vela-*.png
          if-no-files-found: error

      - name: Upload .app (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: Vela-macos-arm64-app
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Vela.app
          if-no-files-found: error

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Vela-macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error